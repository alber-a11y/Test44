name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master, 'ccr-*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Zip build for game portals
        run: cd dist && zip -qr ../hearthguard-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: hearthguard-web
          path: hearthguard-web.zip
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Pages must be enabled once in Settings → Pages → Source: GitHub Actions.
    # Until then the deploy step is allowed to fail without marking the run red.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
